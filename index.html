<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherChat — Private Message Encoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 CipherChat</h1>
            <p>100% Client-Side Private Messenger</p>
        </header>

        <main>
            <label for="messageInput">Your Message / Ciphertext:</label>
            <textarea id="messageInput" rows="4" placeholder="Type your message here..."></textarea>

            <div class="controls">
                <div>
                    <label for="shiftKey">Shift Key (1–25):</label>
                    <input type="number" id="shiftKey" value="7" min="1" max="25">
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="base64Toggle" checked>
                    <span>Enable Base64 Stealth Layer (Hides spaces & emojis)</span>
                </label>
            </div>

            <div class="buttons">
                <button id="encryptBtn">Encrypt</button>
                <button id="decryptBtn">Decrypt</button>
            </div>

            <label for="outputText">Result:</label>
            <textarea id="outputText" rows="4" readonly placeholder="Output will appear here..."></textarea>
            
            <button id="copyBtn" class="copy-btn">📋 Copy Result</button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
